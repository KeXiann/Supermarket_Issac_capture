[project]
name = "g1-isaacsim-bridge"
version = "0.1.0"
description = "Pinned G1 Revo2 capture bridge and static asset validation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.0",
  "scipy==1.15.3",
  "torch==2.7.0",
  "torchvision==0.22.0",
  "isaacsim[all,extscache]==5.1.0.0",
  "isaaclab==0.54.2",
  "cyclonedds==0.10.2",
  "pyarrow>=21,<26",
  "pandas>=2.2,<4",
  "opencv-python==4.11.0.86",
  "av==18.1.0",
  "msgpack>=1,<2",
  "msgpack-numpy==0.4.8",
  "pyzmq>=26,<28",
  "pyyaml>=6,<7",
  "onnxruntime>=1.20,<2",
  "h5py==3.12.1",
  "requests>=2.32,<3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Isaac Lab 2.3.2 pins Starlette 0.49.1; Isaac Sim 5.1 pins an older FastAPI
# which excludes it. Use the FastAPI release supporting Starlette 0.49.1.
# This dependency override is local to this uv environment, not the asset repo.
override-dependencies = ["fastapi==0.121.3"]
[tool.uv.extra-build-dependencies]
isaaclab = ["toml"]
flatdict = ["setuptools<81"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
isaacsim = { index = "nvidia" }
isaaclab = { path = ".runtime/IsaacLab-2.3.2-sparse/source/isaaclab", editable = true }
